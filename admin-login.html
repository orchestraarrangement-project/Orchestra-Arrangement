<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Orchestra</title>
    
    <!-- ✅ CDN do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 440px;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            font-size: 2.5rem;
            color: #5B4C9D;
            font-weight: 900;
        }

        .logo p {
            color: #666;
            margin-top: 8px;
            font-size: 1rem;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            border: 1px solid #fcc;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>ORCHESTRA</h1>
            <p>Painel Administrativo</p>
        </div>

        <div class="error-message" id="errorMessage" style="display: none;"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="admin@orchestra.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••"
                    required
                >
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                Entrar
            </button>
        </form>

        <div class="loading" id="loading">Verificando credenciais...</div>
    </div>

    <script>
    // ✅ Configuração do Supabase
    const supabaseUrl = 'https://zuqkclsdztbyzslzmzfr.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1cWtjbHNkenRieXpzbHptemZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NzM0NzgsImV4cCI6MjA3ODU0OTQ3OH0.nBC2GYWPTfdaSYzi0jOgnBu4bi5xURoHBJ70MRjrdOs';
    const client = window.supabase.createClient(supabaseUrl, supabaseKey);

    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    const btnLogin = document.getElementById('btnLogin');
    const loading = document.getElementById('loading');

    // 🔐 Função para fazer hash da senha (SHA-256)
    async function hashSenha(senha) {
        const encoder = new TextEncoder();
        const data = encoder.encode(senha);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        return hashHex;
    }

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        // Validação básica
        if (!email || !password) {
            mostrarErro('Por favor, preencha todos os campos');
            return;
        }

        try {
            btnLogin.disabled = true;
            btnLogin.textContent = 'Verificando...';
            loading.style.display = 'block';
            errorMessage.style.display = 'none';

            console.log('🔄 Tentando login com:', email);

            // 🔐 Hash da senha digitada
            const senhaHash = await hashSenha(password);
            console.log('🔐 Senha hash:', senhaHash);

            // ✅ Buscar usuário na tabela 'users' com email E senha hasheada
            const { data: usuario, error } = await client
                .from('users')
                .select('*')
                .eq('email', email)
                .eq('senha', senhaHash)
                .single();

            if (error || !usuario) {
                console.error('❌ Login falhou:', error);
                throw new Error('Email ou senha incorretos');
            }

            console.log('✅ Login bem-sucedido!', usuario);
            
            // Salvar sessão no localStorage
            localStorage.setItem('orchestra_user', JSON.stringify({
                id: usuario.id,
                nome: usuario.nome,
                email: usuario.email,
                tipo: usuario.tipo
            }));
            
            // Redirecionar para dashboard
            window.location.href = 'admin-dashboard.html';

        } catch (erro) {
            console.error('❌ Erro:', erro);
            mostrarErro(erro.message || 'Erro ao fazer login. Tente novamente.');
            btnLogin.disabled = false;
            btnLogin.textContent = 'Entrar';
            loading.style.display = 'none';
        }
    });

    function mostrarErro(mensagem) {
        errorMessage.textContent = mensagem;
        errorMessage.style.display = 'block';
    }

    // Verificar se já está logado
    window.addEventListener('DOMContentLoaded', () => {
        const user = localStorage.getItem('orchestra_user');
        if (user) {
            window.location.href = 'admin-dashboard.html';
        }
    });
</script>

</body>
</html>
