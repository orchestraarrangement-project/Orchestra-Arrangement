<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Orchestra</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #f5f5f5;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 200px;
            background: linear-gradient(180deg, #4a148c 0%, #6a1b9a 100%);
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
        }

        .sidebar h1 {
            font-size: 1.5rem;
            margin-bottom: 30px;
            font-weight: 900;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: rgba(255,255,255,0.15);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-left: 200px;
        }

        .header {
            background: white;
            padding: 20px 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .content {
            padding: 30px;
            overflow-y: auto;
        }

        .profile-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .profile-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            margin: 0 auto 20px;
            font-weight: bold;
        }

        .profile-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .profile-subtitle {
            color: #666;
            font-size: 1rem;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
            color: #999;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #f8f9ff;
        }

        .info-box {
            background: #f8f9ff;
            border-left: 4px solid #667eea;
            padding: 16px 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .info-box p {
            margin: 0;
            color: #555;
            font-size: 0.95rem;
        }

        /* MODAL */
        .modal-senha {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .modal-senha.active {
            display: flex;
        }

        .modal-senha-box {
            background: white;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-senha-header {
            padding: 24px 30px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-senha-header h3 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #999;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .btn-close:hover {
            background: #f0f0f0;
            color: #333;
        }

        .modal-senha-box form {
            padding: 30px;
        }

        .modal-senha-footer {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-senha-footer .btn {
            flex: 1;
        }

        .senha-strength {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .senha-strength.fraca {
            background: #ffebee;
            color: #c62828;
            display: block;
        }

        .senha-strength.media {
            background: #fff3e0;
            color: #ef6c00;
            display: block;
        }

        .senha-strength.forte {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }
    </style>
</head>
<body>
    <!-- SIDEBAR -->
    <div class="sidebar">
        <h1>ORCHESTRA</h1>
        <a href="admin-dashboard.html">🏠 Dashboard</a>
        <a href="admin-partituras.html">🎼 Partituras</a>
        <a href="admin-ebooks.html">📚 Ebooks</a>
        <a href="admin-usuarios.html">👥 Usuários</a>
        <a href="admin-configuracoes.html" class="active">⚙️ Configurações</a>
        <div style="margin-top: auto;">
            <a href="admin-login.html" onclick="localStorage.clear()">🚪 Sair</a>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">
        <div class="header">
            <h1>⚙️ Configurações</h1>
        </div>

        <div class="content">
            <div class="profile-container">
                <div class="profile-card">
                    <div class="profile-header">
                        <div class="profile-avatar" id="avatarInitial">A</div>
                        <h2 class="profile-title" id="userName">Admin</h2>
                        <p class="profile-subtitle">Administrador</p>
                    </div>

                    <div class="form-section">
                        <h3 class="section-title">👤 Dados do Usuário</h3>
                        
                        <div class="form-group">
                            <label>Login / Email</label>
                            <input type="email" id="userEmail" value="admin@orchestra.com" disabled>
                        </div>

                        <div class="form-group">
                            <label>Nome</label>
                            <input type="text" id="userNameInput" placeholder="Digite seu nome" value="Admin">
                        </div>

                        <div class="form-group">
                            <label>Telefone</label>
                            <input type="tel" id="userPhone" placeholder="(00) 00000-0000">
                        </div>
                    </div>

                    <div class="form-section">
                        <h3 class="section-title">🔒 Segurança</h3>
                        
                        <button class="btn btn-secondary" onclick="abrirModalSenha()">
                            🔑 Alterar Senha
                        </button>

                        <div class="info-box">
                            <p>💡 <strong>Dica:</strong> Escolha uma senha forte com letras, números e símbolos.</p>
                        </div>
                    </div>

                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="salvarPerfil()">
                            💾 Salvar Alterações
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL ALTERAR SENHA -->
    <div id="modalSenha" class="modal-senha" onclick="if(event.target==this) fecharModalSenha()">
        <div class="modal-senha-box">
            <div class="modal-senha-header">
                <h3>🔑 Alterar Senha</h3>
                <button class="btn-close" onclick="fecharModalSenha()">✕</button>
            </div>
            
            <form id="formSenha" onsubmit="alterarSenha(event)">
                <div class="form-group">
                    <label>Nova Senha</label>
                    <input type="password" id="novaSenha" required minlength="6" placeholder="Mínimo 6 caracteres">
                </div>

                <div class="form-group">
                    <label>Confirmar Nova Senha</label>
                    <input type="password" id="confirmarSenha" required minlength="6" placeholder="Digite novamente">
                </div>

                <div class="senha-strength" id="senhaStrength"></div>

                <div class="modal-senha-footer">
                    <button type="button" class="btn btn-secondary" onclick="fecharModalSenha()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnAlterarSenha">
                        🔒 Alterar Senha
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
    const supabaseUrl = 'https://zuqkclsdztbyzslzmzfr.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1cWtjbHNkenRieXpzbHptemZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NzM0NzgsImV4cCI6MjA3ODU0OTQ3OH0.nBC2GYWPTfdaSYzi0jOgnBu4bi5xURoHBJ70MRjrdOs';
    const client = window.supabase.createClient(supabaseUrl, supabaseKey);

    let usuarioAtual = null;

    // ✅ Carregar perfil do banco
    async function carregarPerfil() {
        try {
            const userStorage = localStorage.getItem('orchestra_user');
            if (!userStorage) {
                console.log('❌ Nenhum usuário logado');
                window.location.href = 'admin-login.html';
                return;
            }

            usuarioAtual = JSON.parse(userStorage);
            console.log('✅ Usuário do localStorage:', usuarioAtual);

            // Buscar dados completos do banco
            const { data: usuarioCompleto, error } = await client
                .from('users')
                .select('*')
                .eq('id', usuarioAtual.id)
                .single();

            if (error) {
                console.error('❌ Erro ao buscar usuário:', error);
                preencherCampos(usuarioAtual);
                return;
            }

            console.log('✅ Dados do banco:', usuarioCompleto);
            usuarioAtual = usuarioCompleto; // Atualizar com dados completos
            preencherCampos(usuarioCompleto);

        } catch (e) {
            console.error('❌ Erro:', e);
        }
    }

    // ✅ Preencher campos do formulário
    function preencherCampos(usuario) {
        // Email
        const emailInput = document.getElementById('userEmail');
        if (emailInput) {
            emailInput.value = usuario.email || '';
        }

        // Nome no campo de input
        const nomeInput = document.getElementById('userNameInput');
        if (nomeInput) {
            nomeInput.value = usuario.nome || '';
        }

        // Nome no título
        const userNameTitle = document.getElementById('userName');
        if (userNameTitle) {
            userNameTitle.textContent = usuario.nome || usuario.email.split('@')[0];
        }

        // Avatar inicial
        const avatarInitial = document.getElementById('avatarInitial');
        if (avatarInitial) {
            const inicial = (usuario.nome || usuario.email)[0].toUpperCase();
            avatarInitial.textContent = inicial;
        }

        // Telefone (se existir)
        const telefoneInput = document.getElementById('userPhone');
        if (telefoneInput && usuario.telefone) {
            telefoneInput.value = usuario.telefone;
        }

        console.log('✅ Campos preenchidos com sucesso!');
    }

    // ✅ Salvar perfil no banco
    async function salvarPerfil() {
        const nome = document.getElementById('userNameInput').value.trim();
        const telefone = document.getElementById('userPhone').value.trim();

        if (!usuarioAtual || !usuarioAtual.id) {
            alert('❌ Erro: usuário não identificado');
            return;
        }

        try {
            console.log('💾 Salvando perfil...');

            // Atualizar no banco
            const { data, error } = await client
                .from('users')
                .update({ 
                    nome: nome,
                    telefone: telefone
                })
                .eq('id', usuarioAtual.id)
                .select()
                .single();

            if (error) {
                console.error('❌ Erro ao salvar:', error);
                throw error;
            }

            console.log('✅ Perfil atualizado no banco:', data);

            // Atualizar localStorage
            usuarioAtual.nome = nome;
            usuarioAtual.telefone = telefone;
            localStorage.setItem('orchestra_user', JSON.stringify(usuarioAtual));

            alert('✅ Perfil atualizado com sucesso!');
            carregarPerfil(); // Recarregar dados

        } catch (e) {
            console.error('❌ Erro ao salvar:', e);
            alert('❌ Erro ao salvar. Tente novamente.');
        }
    }

    // ✅ Modal de senha
    function abrirModalSenha() {
        document.getElementById('modalSenha').classList.add('active');
        document.getElementById('formSenha').reset();
        document.getElementById('senhaStrength').style.display = 'none';
    }

    function fecharModalSenha() {
        document.getElementById('modalSenha').classList.remove('active');
    }

    // ✅ Verificar força da senha
    document.getElementById('novaSenha').addEventListener('input', (e) => {
        const senha = e.target.value;
        const strength = document.getElementById('senhaStrength');
        
        if (senha.length === 0) {
            strength.style.display = 'none';
            return;
        }
        
        let nivel = 0;
        if (senha.length >= 8) nivel++;
        if (/[A-Z]/.test(senha)) nivel++;
        if (/[0-9]/.test(senha)) nivel++;
        if (/[^A-Za-z0-9]/.test(senha)) nivel++;
        
        strength.className = 'senha-strength';
        
        if (nivel <= 1) {
            strength.classList.add('fraca');
            strength.textContent = '❌ Senha Fraca';
        } else if (nivel <= 2) {
            strength.classList.add('media');
            strength.textContent = '⚠️ Senha Média';
        } else {
            strength.classList.add('forte');
            strength.textContent = '✅ Senha Forte';
        }
    });

    // ✅ Hash SHA-256
    async function hashSenha(senha) {
        const encoder = new TextEncoder();
        const data = encoder.encode(senha);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        return hashHex;
    }

    // ✅ Alterar senha
    async function alterarSenha(event) {
        event.preventDefault();
        
        const novaSenha = document.getElementById('novaSenha').value;
        const confirmarSenha = document.getElementById('confirmarSenha').value;
        const btn = document.getElementById('btnAlterarSenha');
        
        if (novaSenha !== confirmarSenha) {
            alert('❌ As senhas não coincidem!');
            return;
        }
        
        if (novaSenha.length < 6) {
            alert('❌ A senha deve ter no mínimo 6 caracteres!');
            return;
        }

        if (!usuarioAtual || !usuarioAtual.id) {
            alert('❌ Erro: usuário não identificado');
            return;
        }
        
        btn.disabled = true;
        btn.textContent = '🔄 Alterando...';
        
        try {
            // Hash da nova senha
            const senhaHash = await hashSenha(novaSenha);
            console.log('🔐 Hash da nova senha:', senhaHash);

            // Atualizar no banco
            const { data, error } = await client
                .from('users')
                .update({ senha: senhaHash })
                .eq('id', usuarioAtual.id)
                .select()
                .single();
            
            if (error) {
                console.error('❌ Erro:', error);
                throw error;
            }

            console.log('✅ Senha alterada:', data);
            alert('✅ Senha alterada com sucesso!');
            fecharModalSenha();

        } catch (e) {
            console.error('❌ Erro:', e);
            alert('❌ Erro ao alterar senha. Tente novamente.');
        } finally {
            btn.disabled = false;
            btn.textContent = '🔒 Alterar Senha';
        }
    }

    // ✅ Carregar ao abrir a página
    window.addEventListener('DOMContentLoaded', carregarPerfil);
</script>

</body>
</html>
