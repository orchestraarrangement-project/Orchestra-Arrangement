<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Ebook - Orchestra</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">
                <img src="imagens/logo-branca.png" alt="Orchestra" style="height: 40px;">
            </a>
            <nav class="nav">
                <a href="index.html" class="nav-link">Início</a>
                <a href="partituras.html" class="nav-link">Partituras</a>
                <a href="ebooks.html" class="nav-link">Ebooks</a>
            </nav>
        </div>
    </header>

    <section class="detail-section">
        <div class="container">
            <div class="detail-grid">
                <div class="detail-image">
                    <img id="ebookImagem" src="" alt="Capa do Ebook">
                </div>
                <div class="detail-info">
                    <div class="detail-badges">
                        <span class="badge" id="ebookNivel"></span>
                        <span class="badge" id="ebookCategoria"></span>
                    </div>
                    <h1 class="detail-title" id="ebookTitulo"></h1>
                    <p class="detail-description" id="ebookDescricao"></p>
                    
                    <div class="detail-meta">
                        <div class="meta-item">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M10 5V10L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            <span id="ebookDuracao"></span>
                        </div>
                        <div class="meta-item">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M3 3H17V17H3V3Z" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M7 7H13M7 10H13M7 13H10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            <span id="ebookPaginas"></span>
                        </div>
                    </div>

                    <div class="detail-price">
                        <span class="price-label">Investimento:</span>
                        <span class="price-value" id="ebookPreco"></span>
                    </div>

                    <button class="btn btn-primary btn-large" id="btnComprar">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M3 3L5 3L7 13L16 13L18 6L6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="7.5" cy="16.5" r="1.5" fill="currentColor"/>
                            <circle cx="15.5" cy="16.5" r="1.5" fill="currentColor"/>
                        </svg>
                        Adquirir Ebook
                    </button>
                </div>
            </div>

            <div class="detail-content">
                <h2>Sobre este Ebook</h2>
                <div id="ebookConteudo"></div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <div class="logo">
                        <img src="imagens/logo-branca.png" alt="Orchestra" style="height: 40px;">
                    </div>
                    <p class="footer-description">Sua plataforma completa para aprender música</p>
                </div>
                <div class="footer-links">
                    <div class="footer-column">
                        <h4 class="footer-title">Links Rápidos</h4>
                        <ul class="footer-list">
                            <li><a href="ebooks.html">Ebooks</a></li>
                            <li><a href="partituras.html">Partituras</a></li>
                        </ul>
                    </div>
                    <div class="footer-column">
                        <h4 class="footer-title">Contato</h4>
                        <ul class="footer-list">
                            <li><a href="mailto:contato@orchestra-arrangement.com">contato@orchestra-arrangement.com</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 Orchestra. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <script>
        async function carregarEbook() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                window.location.href = 'ebooks.html';
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('cursos')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (error) throw error;

                document.getElementById('ebookTitulo').textContent = data.titulo;
                document.getElementById('ebookDescricao').textContent = data.descricao;
                document.getElementById('ebookImagem').src = data.imagem_capa || 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=600';
                document.getElementById('ebookNivel').textContent = data.nivel;
                document.getElementById('ebookCategoria').textContent = data.categoria;
                document.getElementById('ebookDuracao').textContent = data.duracao || '2-3 horas';
                document.getElementById('ebookPaginas').textContent = data.paginas ? `${data.paginas} páginas` : 'Digital';
                document.getElementById('ebookPreco').textContent = data.preco ? `R$ ${parseFloat(data.preco).toFixed(2)}` : 'Consulte';
                document.getElementById('ebookConteudo').innerHTML = data.conteudo || '<p>Informações completas em breve.</p>';

            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao carregar ebook');
                window.location.href = 'ebooks.html';
            }
        }

        document.addEventListener('DOMContentLoaded', carregarEbook);
    </script>
</body>
</html>
