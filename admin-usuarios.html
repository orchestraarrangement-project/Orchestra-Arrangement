    <main class="admin-main">
        <header class="admin-header">
            <div class="header-left">
                <h1 class="page-title">Gerenciar Usuários</h1>
                <p class="page-subtitle">Adicione, edite ou remova usuários da plataforma</p>
            </div>
            <div class="header-right">
                <button class="btn btn-primary" onclick="abrirModal()">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M10 5V15M5 10H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Novo Usuário
                </button>
            </div>
        </header>

        <section class="admin-filters">
            <div class="search-box">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M14 14L18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <input type="text" placeholder="Buscar usuários..." class="search-input" id="searchInput">
            </div>
            <select class="filter-select-admin" id="tipoFilter">
                <option value="">Todos os tipos</option>
                <option value="admin">Administradores</option>
                <option value="usuario">Clientes</option>
            </select>
        </section>

        <section class="admin-table-section">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Tipo</th>
                        <th>Cadastro</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="usuariosTableBody">
                    <tr>
                        <td colspan="5" style="text-align:center;padding:40px;color:#999;">Carregando usuários...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- MODAL -->
    <div id="usuarioModal" class="modal" style="display:none;">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Novo Usuário</h2>
                <button class="modal-close" onclick="fecharModal()">×</button>
            </div>

            <form class="modal-form" id="usuarioForm">
                <div class="form-group">
                    <label class="form-label">Nome Completo*</label>
                    <input type="text" id="nome" class="form-input" placeholder="Ex: João Silva" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email*</label>
                    <input type="email" id="email" class="form-input" placeholder="joao@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Senha*</label>
                    <input type="password" id="senha" class="form-input" placeholder="Mínimo 6 caracteres" minlength="6">
                    <small style="color:#666;font-size:12px;" id="senhaHint">Deixe em branco para manter a senha atual</small>
                </div>

                <div class="form-group">
                    <label class="form-label">Tipo de Usuário*</label>
                    <select id="tipo" class="form-input" required>
                        <option value="usuario">Cliente</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSalvar">Salvar Usuário</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://zuqkclsdztbyzslzmzfr.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1cWtjbHNkenRieXpzbHptemZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NzM0NzgsImV4cCI6MjA3ODU0OTQ3OH0.nBC2GYWPTfdaSYzi0jOgnBu4bi5xURoHBJ70MRjrdOs';
        const client = window.supabase.createClient(supabaseUrl, supabaseKey);

        let usuarios = [];
        let editandoId = null;

        async function hashSenha(senha) {
            const encoder = new TextEncoder();
            const data = encoder.encode(senha);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function carregarUsuarios() {
            try {
                const { data, error } = await client
                    .from('users')
                    .select('*');

                if (error) throw error;

                usuarios = data || [];
                console.log('✅ Usuários carregados:', usuarios);
                renderizarTabela(usuarios);
            } catch (erro) {
                console.error('❌ Erro:', erro);
                document.getElementById('usuariosTableBody').innerHTML = 
                    '<tr><td colspan="5" style="text-align:center;padding:40px;color:#e74c3c;">Erro ao carregar usuários</td></tr>';
            }
        }

        function renderizarTabela(lista) {
            const tbody = document.getElementById('usuariosTableBody');
            
            if (!lista || lista.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:#999;">Nenhum usuário encontrado</td></tr>';
                return;
            }

            tbody.innerHTML = lista.map(u => `
                <tr>
                    <td><strong>${u.nome || 'Sem nome'}</strong></td>
                    <td>${u.email}</td>
                    <td><span class="table-badge ${u.tipo === 'admin' ? 'badge-pink' : 'badge-blue'}">${u.tipo === 'admin' ? 'Administrador' : 'Cliente'}</span></td>
                    <td>${new Date(u.created_at || Date.now()).toLocaleDateString('pt-BR')}</td>
                    <td>
                        <div class="table-actions">
                            <button class="action-btn action-edit" onclick="editarUsuario('${u.id}')" title="Editar">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                    <path d="M11 2L14 5L5 14H2V11L11 2Z" stroke="currentColor" stroke-width="1.5"/>
                                </svg>
                            </button>
                            <button class="action-btn action-delete" onclick="deletarUsuario('${u.id}', '${(u.nome || u.email).replace(/'/g, '')}')" title="Excluir">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                    <path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function abrirModal() {
            editandoId = null;
            document.getElementById('usuarioForm').reset();
            document.getElementById('modalTitle').textContent = 'Novo Usuário';
            document.getElementById('btnSalvar').textContent = 'Salvar Usuário';
            document.getElementById('senha').required = true;
            document.getElementById('senhaHint').style.display = 'none';
            document.getElementById('email').disabled = false;
            document.getElementById('usuarioModal').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('usuarioModal').style.display = 'none';
            editandoId = null;
            document.getElementById('usuarioForm').reset();
        }

        async function editarUsuario(id) {
            try {
                const usuario = usuarios.find(u => u.id === id);
                if (!usuario) return;

                editandoId = id;
                
                document.getElementById('nome').value = usuario.nome || '';
                document.getElementById('email').value = usuario.email;
                document.getElementById('email').disabled = true;
                document.getElementById('senha').value = '';
                document.getElementById('senha').required = false;
                document.getElementById('tipo').value = usuario.tipo;
                document.getElementById('senhaHint').style.display = 'block';

                document.getElementById('modalTitle').textContent = 'Editar Usuário';
                document.getElementById('btnSalvar').textContent = 'Atualizar Usuário';
                document.getElementById('usuarioModal').style.display = 'flex';
            } catch (erro) {
                console.error('Erro:', erro);
                alert('Erro ao carregar dados do usuário');
            }
        }

        async function salvarUsuario(event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const tipo = document.getElementById('tipo').value;

            try {
                if (editandoId) {
                    const updateData = { nome, tipo };

                    if (senha && senha.length >= 6) {
                        updateData.senha = await hashSenha(senha);
                    }

                    const { error } = await client
                        .from('users')
                        .update(updateData)
                        .eq('id', editandoId);

                    if (error) throw error;
                    alert('✅ Usuário atualizado com sucesso!');
                } else {
                    if (!senha || senha.length < 6) {
                        alert('❌ A senha deve ter no mínimo 6 caracteres!');
                        return;
                    }

                    const { data: existente } = await client
                        .from('users')
                        .select('id')
                        .eq('email', email)
                        .single();

                    if (existente) {
                        alert('❌ Este email já está cadastrado!');
                        return;
                    }

                    const senhaHash = await hashSenha(senha);

                    const { error } = await client
                        .from('users')
                        .insert([{ nome, email, senha: senhaHash, tipo }]);

                    if (error) throw error;
                    alert('✅ Usuário criado com sucesso!');
                }

                fecharModal();
                carregarUsuarios();
            } catch (erro) {
                console.error('Erro:', erro);
                alert('❌ Erro ao salvar: ' + erro.message);
            }
        }

        async function deletarUsuario(id, nome) {
            if (!confirm(`Tem certeza que deseja excluir "${nome}"?\n\nEsta ação não pode ser desfeita!`)) {
                return;
            }

            try {
                const { error } = await client
                    .from('users')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                alert('✅ Usuário excluído com sucesso!');
                carregarUsuarios();
            } catch (erro) {
                console.error('Erro:', erro);
                alert('❌ Erro ao excluir: ' + erro.message);
            }
        }

        // BUSCA
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const busca = e.target.value.toLowerCase();
            const filtrados = usuarios.filter(u => 
                (u.nome && u.nome.toLowerCase().includes(busca)) ||
                u.email.toLowerCase().includes(busca)
            );
            renderizarTabela(filtrados);
        });

        // FILTRO TIPO
        document.getElementById('tipoFilter').addEventListener('change', function(e) {
            const tipo = e.target.value;
            const filtrados = tipo ? usuarios.filter(u => u.tipo === tipo) : usuarios;
            renderizarTabela(filtrados);
        });

        // FECHAR MODAL AO CLICAR FORA
        window.onclick = function(event) {
            if (event.target == document.getElementById('usuarioModal')) {
                fecharModal();
            }
        }

        // VINCULAR SUBMIT
        document.getElementById('usuarioForm').addEventListener('submit', salvarUsuario);

        // INICIALIZAR
        document.addEventListener('DOMContentLoaded', carregarUsuarios);
    </script>
</body>
